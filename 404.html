<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C1F10">
<title>Không tìm thấy trang · FarmBlock</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&display=swap" rel="stylesheet">
<style>
:root{--g900:#0C1F10;--g800:#112615;--g600:#234D2B;--lime:#B5E383;--on-dark:#EEF6E6;--on-dark-2:#C9DDBF}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--g800),var(--g900) 70%);color:var(--on-dark);font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:32px 20px;padding-bottom:max(32px,env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
main{max-width:560px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;color:var(--on-dark);text-decoration:none;font-weight:700;letter-spacing:.08em;font-stretch:115%;font-size:15px;margin-bottom:44px}
.logo img{width:34px;height:34px}
.code{font-size:clamp(84px,24vw,148px);line-height:.9;font-weight:700;font-stretch:125%;color:var(--lime);letter-spacing:-.02em}
h1{font-size:clamp(22px,5.4vw,30px);font-weight:600;margin:22px 0 12px;line-height:1.25}
p{color:var(--on-dark-2);font-size:16px;line-height:1.6}
p.en{font-size:14px;opacity:.75;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.acts a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .2s,background .2s}
.acts a:active{transform:scale(.97)}
.p{background:var(--lime);color:var(--g900)}
.s{border:1.5px solid rgba(201,221,191,.35);color:var(--on-dark)}
.s:hover{background:rgba(201,221,191,.08)}
</style>
</head>
<body>
<main>
<a class="logo" href="/"><img src="/img/favicon.svg" alt="">FARMBLOCK</a>
<div class="code">404</div>
<h1>Trang này không còn ở đây</h1>
<p>Đường dẫn có thể đã đổi hoặc gõ nhầm. Mời bạn quay về trang chủ hoặc xem các bài trong Học viện.</p>
<div class="acts">
<a class="p" href="/">Về trang chủ</a>
<a class="s" href="/hoc-vien.html">Học viện FarmBlock</a>
</div>
</main>
<script>try{if(localStorage.getItem('fb-lang')==='en'){document.documentElement.lang='en';document.title='Page not found · FarmBlock';var T={h1:'This page is no longer here',p:'The link may have changed or been mistyped. Head back to the home page or browse the FarmBlock Academy.'};document.querySelector('h1').textContent=T.h1;document.querySelector('main p').textContent=T.p;var a=document.querySelectorAll('.acts a');a[0].textContent='Back to home';a[1].textContent='FarmBlock Academy'}}catch(e){}</script>
</body>
</html>
