            if [ -f "$s.json" ]; then git rm -q "$s.json"; n=$((n+1)); fi
          done
          echo "Da xoa $n file"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Don file JSON thua o thu muc goc" || echo "Khong co gi de xoa"
          git push
